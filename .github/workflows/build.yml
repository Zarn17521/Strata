name: ZN Beta - Build

on:
  workflow_dispatch:
  push:
    branches:
      - beta/v0.1.1

jobs:
  build:
    name: Build using xcodebuild command
    if: github.ref == 'refs/heads/beta/v0.1.1'
    runs-on: xcode-27
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Restore pinned upstream idevice FFI library for StikJIT
        shell: bash
        run: |
          set -euo pipefail
          # The vendored idevice.h is from StikJIT commit 32287268;
          # the corresponding 57 MB arm64 static archive is not stored in this fork.
          # Restore precisely that upstream object before Xcode links ShareExtension.
          archive="Vendor/StikJIT/idevice/libidevice_ffi.a"
          curl --fail --location --retry 5 --retry-delay 3 --show-error --silent \
            "https://raw.githubusercontent.com/StikDebug/StikJIT/32287268fa5824f9edce4cb359f5833ce0cf7b00/idevice/libidevice_ffi.a" \
            --output "$archive"
          expected="3fb7e2dbfdb9db3d47bd6364a435bbc10d5581f9"
          actual="$(git hash-object "$archive")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The downloaded idevice library does not match the pinned upstream Git blob"
            exit 1
          fi
          test "$(stat -f %z "$archive")" -gt 50000000 || { echo "::error::idevice archive is incomplete"; exit 1; }
          lipo -info "$archive"
          xcrun lipo -verify_arch arm64 "$archive"
          echo "idevice FFI restored and Git object identity verified."

      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Prepare ZN app icon
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Resources/ZNIcon.png ]; then
            python3 .github/scripts/prepare_zn_icon.py
          else
            echo "::warning::ZNIcon.png has not been uploaded to Resources; retaining existing app icon."
          fi
      - name: Embed user-supplied NxNative photo skins
        shell: bash
        run: |
          set -euo pipefail
          # Prepare photographic controls offline in the build runner.
          # No OpenCV dependency or image processing is shipped to the iPhone.
          python3 -m venv "$RUNNER_TEMP/strata-skin-venv"
          "$RUNNER_TEMP/strata-skin-venv/bin/python" -m pip install --disable-pip-version-check "opencv-python-headless==4.13.0.92"
          "$RUNNER_TEMP/strata-skin-venv/bin/python" .github/scripts/embed_nxnative_skins.py
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: |
          set +e
          # Preserve the raw compiler output; xcpretty often hides the exact Swift
          # diagnostic while still reporting "SwiftCompile failed".
          xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release 2>&1 | tee "$RUNNER_TEMP/strata-xcodebuild.log" | xcpretty
          result="${PIPESTATUS[0]}"
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Compiler diagnostics (raw xcodebuild log)"
            grep -nE 'error:|fatal error:|SwiftCompile|\.swift:[0-9]+:[0-9]+' "$RUNNER_TEMP/strata-xcodebuild.log" | tail -n 120 || true
            echo "::endgroup::"
          fi
          exit "$result"
      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Strata-Xcode-Compiler-Log
          path: ${{ runner.temp }}/strata-xcodebuild.log
          if-no-files-found: warn
          retention-days: 3
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Create IPA
        run: |
          sh .github/build_github.sh

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZN-Library-v0.1.1-Beta.ipa
          path: ${{ env.scheme }}.ipa
      
      - name: Upload LiveContainer+SideStore
        uses: actions/upload-artifact@v7
        with:
          name: ZN-Library-v0.1.1-Beta+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa

