name: ZN Beta - Build

on:
  workflow_dispatch:
    inputs:
      installed_host_bundle_id:
        description: 'Optional: final installed SideStore host bundle ID (Memory Lab test only)'
        required: false
        type: string
  push:
    branches:
      - beta/v0.1.1

jobs:
  build:
    name: Build using xcodebuild command
    if: github.ref == 'refs/heads/beta/v0.1.1'
    runs-on: xcode-27
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Configure personalized Memory Helper binding
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.installed_host_bundle_id != '' }}
        shell: bash
        env:
          ZN_INSTALLED_HOST_ID: ${{ inputs.installed_host_bundle_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          host = os.environ["ZN_INSTALLED_HOST_ID"].strip()
          if not re.fullmatch(r"com\.kdt\.livecontainer\.[A-Z0-9]{10}", host):
              raise SystemExit("Use the exact installed host bundle ID from the Memory Lab report.")
          edits = {
              "MemoryHelperExtension/MemoryHelper.swift": (
                  'AppExtensionPoint.Identifier(host: "com.kdt.livecontainer", name: "ZNMemoryHelper")',
                  f'AppExtensionPoint.Identifier(host: "{host}", name: "ZNMemoryHelper")',
              ),
              "LiveContainerSwiftUI/Views/ZNExperimentalMemoryLab.swift": (
                  '        "com.kdt.livecontainer"\n',
                  f'        "{host}"\n',
              ),
          }
          for filename, (old, new) in edits.items():
              path = Path(filename)
              source = path.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one Release binding in {filename}")
              path.write_text(source.replace(old, new, 1))
          # The Archive step also builds the host with this exact identifier so Xcode
          # generates its .appexpt registration under the final installed identity.
          print("Configured the host, helper, and diagnostic for the final installed identity.")
          PY

      - name: Restore pinned upstream idevice FFI library for StikJIT
        shell: bash
        run: |
          set -euo pipefail
          # The vendored idevice.h is from StikJIT commit 32287268;
          # the corresponding 57 MB arm64 static archive is not stored in this fork.
          # Restore precisely that upstream object before Xcode links ShareExtension.
          archive="Vendor/StikJIT/idevice/libidevice_ffi.a"
          curl --fail --location --retry 5 --retry-delay 3 --show-error --silent \
            "https://raw.githubusercontent.com/StikDebug/StikJIT/32287268fa5824f9edce4cb359f5833ce0cf7b00/idevice/libidevice_ffi.a" \
            --output "$archive"
          expected="3fb7e2dbfdb9db3d47bd6364a435bbc10d5581f9"
          actual="$(git hash-object "$archive")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The downloaded idevice library does not match the pinned upstream Git blob"
            exit 1
          fi
          test "$(stat -f %z "$archive")" -gt 50000000 || { echo "::error::idevice archive is incomplete"; exit 1; }
          lipo -info "$archive"
          xcrun lipo -verify_arch arm64 "$archive"
          echo "idevice FFI restored and Git object identity verified."

      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Prepare ZN app icon
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Resources/ZNIcon.png ]; then
            python3 .github/scripts/prepare_zn_icon.py
          else
            echo "::warning::ZNIcon.png has not been uploaded to Resources; retaining existing app icon."
          fi
      - name: Embed user-supplied NxNative photo skins
        shell: bash
        run: |
          set -euo pipefail
          # Prepare photographic controls offline in the build runner.
          # No OpenCV dependency or image processing is shipped to the iPhone.
          python3 -m venv "$RUNNER_TEMP/strata-skin-venv"
          "$RUNNER_TEMP/strata-skin-venv/bin/python" -m pip install --disable-pip-version-check "opencv-python-headless==4.13.0.92"
          "$RUNNER_TEMP/strata-skin-venv/bin/python" .github/scripts/embed_nxnative_skins.py
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
          ZN_INSTALLED_HOST_ID: ${{ inputs.installed_host_bundle_id }}
        run: |
          set +e
          # Preserve the raw compiler output; xcpretty often hides the exact Swift
          # diagnostic while still reporting "SwiftCompile failed".
          bundle_id_setting=()
          if [[ -n "$ZN_INSTALLED_HOST_ID" ]]; then
            # The host bundle ID must match the ID compiled into the helper binding.
            # This also makes Xcode generate the host .appexpt registration for that ID.
            bundle_id_setting+=("LIVECONTAINER_BUNDLE_IDENTIFIER=$ZN_INSTALLED_HOST_ID")
          fi
          xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release "${bundle_id_setting[@]}" 2>&1 | tee "$RUNNER_TEMP/strata-xcodebuild.log" | xcpretty
          result="${PIPESTATUS[0]}"
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Compiler diagnostics (raw xcodebuild log)"
            grep -nE 'error:|fatal error:|SwiftCompile|\.swift:[0-9]+:[0-9]+' "$RUNNER_TEMP/strata-xcodebuild.log" | tail -n 120 || true
            echo "::endgroup::"
          fi
          exit "$result"
      - name: Inspect archived Memory Helper metadata
        shell: bash
        env:
          ZN_INSTALLED_HOST_ID: ${{ inputs.installed_host_bundle_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          app = Path("archive.xcarchive/Products/Applications/LiveContainer.app")
          helper = app / "Extensions/MemoryHelperExtension.appex"
          host_plist = plistlib.loads((app / "Info.plist").read_bytes())
          helper_plist = plistlib.loads((helper / "Info.plist").read_bytes())
          expected = os.environ.get("ZN_INSTALLED_HOST_ID", "").strip() or "com.kdt.livecontainer"
          archive_host = host_plist.get("CFBundleIdentifier")
          print("Archive host ID:", archive_host)
          print("Archive helper ID:", helper_plist.get("CFBundleIdentifier"))
          files = [p for p in app.rglob("*.appexpt")
                   if not any(part.endswith((".appex", ".framework", ".app"))
                              for part in p.relative_to(app).parts[:-1])]
          print("Host .appexpt paths:", [str(p.relative_to(app)) for p in files])
          def read_registration(path):
              if path.is_file():
                  data = path.read_bytes()
                  try:
                      return plistlib.dumps(plistlib.loads(data))
                  except Exception:
                      return data
              if path.is_dir():
                  return b"\n".join(read_registration(p) for p in path.iterdir())
              return b""
          host_point = any(b"ZNMemoryHelper" in read_registration(p) for p in files)
          binding = plistlib.dumps(helper_plist)
          helper_point = b"ZNMemoryHelper" in binding
          helper_host = expected.encode() in binding
          print("Host registration names custom point:", host_point)
          print("Helper plist names custom point:", helper_point)
          print("Helper plist includes expected host:", helper_host)
          if os.environ.get("ZN_INSTALLED_HOST_ID", "").strip():
              host_matches = archive_host == expected
              print("Archive host ID matches installed ID:", host_matches)
              if not (host_matches and host_point and helper_point and helper_host):
                  raise SystemExit("Personalized archive metadata or host identity not verified. Inspect this report before installing.")
          elif not (host_point and helper_point and helper_host):
              print("::warning::Memory Helper registration or binding could not be verified in the generic archive.")
          PY
          codesign --verify --strict --verbose=2 "archive.xcarchive/Products/Applications/LiveContainer.app/Extensions/MemoryHelperExtension.appex"

      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Strata-Xcode-Compiler-Log
          path: ${{ runner.temp }}/strata-xcodebuild.log
          if-no-files-found: warn
          retention-days: 3
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Create IPA
        env:
          ZN_INSTALLED_HOST_ID: ${{ inputs.installed_host_bundle_id }}
        run: |
          sh .github/build_github.sh

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZN-Library-v0.1.1-Beta.ipa
          path: ${{ env.scheme }}.ipa
      
      - name: Upload LiveContainer+SideStore
        uses: actions/upload-artifact@v7
        with:
          name: ZN-Library-v0.1.1-Beta+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa

